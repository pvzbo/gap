name: validar-e-publicar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest httpx
      - name: Regras de integridade (GAP_BRIEF §3.5)
        run: python -m gap validate
      - name: Testes
        run: python -m pytest -q
      - name: Build (grafo, métricas, exportações, site/data)
        run: python -m gap build
      - uses: actions/upload-artifact@v7
        with:
          name: export
          path: export/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Habilita o GitHub Pages (fonte "GitHub Actions") se ainda não estiver habilitado.
      # Se falhar por permissão, habilite manualmente em Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v5
