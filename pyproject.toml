[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gap"
version = "0.1.0"
description = "GAP — Genealogia da Arquitetura Pernambucana: base relacional, funil de ingestão e análise de rede"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.2",
  "pymupdf>=1.24",
  "rapidfuzz>=3.0",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "click>=8.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "anthropic>=0.40",
  "GitPython>=3.1",
  "scipy>=1.11",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gap = "gap.cli:main"

[tool.setuptools.packages.find]
include = ["gap*"]

[tool.setuptools.package-data]
"gap.app" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
