# Vocabulário controlado de instituições, escritórios, órgãos e empresas.
#
# O campo `id` é o valor que deve aparecer em pessoas.jsonl
# (atuacao[].nome e formacao[].instituicao). É o que torna o agrupamento
# por metadado confiável ("quem deu aula na EBAP", "quem trabalhou no ETCUR").
#
# tipo: escola | universidade | orgao_publico | escritorio | empresa | associacao | imprensa | laboratorio
# aliases: variantes textuais usadas pelo pré-filtro e pela resolução de entidades.

- id: EBAP
  nome: Escola de Belas Artes de Pernambuco
  tipo: escola
  cidade: Recife
  periodo: "1932-"
  notas: Curso de arquitetura criado em 1945 e reconhecido em 1949; posteriormente incorporado à UFPE.
  aliases: [Escola de Belas Artes de Pernambuco, Escola de Belas Artes, EBA, EBAP, Escola de Belas Artes do Recife]

